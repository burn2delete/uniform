schema_version: "1.0"
preset:
  id: "uniform"
  name: "Uniform bounded change workflow"
  version: "0.1.0"
  description: "Repository contracts, manager autonomy and exact evidence"
  author: "Uniform"
requires:
  speckit_version: "==1.2.3"
provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Specify one bounded Uniform change"
      replaces: "speckit.specify"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan a bounded change against Uniform contracts"
      replaces: "speckit.plan"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Create evidence-linked Uniform tasks"
      replaces: "speckit.tasks"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Execute authorized tasks with exact evidence"
      replaces: "speckit.implement"
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Maintain the existing user-decision record"
      replaces: "speckit.constitution"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Resolve material ambiguity without extra ceremonies"
      replaces: "speckit.clarify"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Analyze consistency and evidence scope"
      replaces: "speckit.analyze"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Record focused review criteria"
      replaces: "speckit.checklist"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Assess the declared increment and remaining evidence"
      replaces: "speckit.converge"
    - type: "command"
      name: "speckit.taskstoissues"
      file: "commands/speckit.taskstoissues.md"
      description: "Report optional issue conversion status"
      replaces: "speckit.taskstoissues"

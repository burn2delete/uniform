name: Public release assessment

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  public-release:
    name: public release assessment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Run public release assessment
        run: clojure -Srepro -M tools/ci/run.clj public-release
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Preserve public release receipts and provenance
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git status --porcelain > target/ci/worktree.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/public-release-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-release-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

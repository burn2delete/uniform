name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  checks:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [static, projections, bootstrap]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Install workflow syntax checker
        if: matrix.mode == 'static'
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint/archive.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/archive.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Run checks in fresh child processes
        env:
          CI_MODE: ${{ matrix.mode }}
        run: clojure -Srepro -M tools/ci/run.clj "$CI_MODE"
      - name: Preserve logs, command receipts and provenance
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD HEAD^{tree} > target/ci/checkout.txt
          git status --porcelain > target/ci/worktree.txt
          java -version > target/ci/java.txt 2>&1
          clojure -Sdescribe > target/ci/clojure.txt 2>&1
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          find target/ci -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  leaves:
    name: fresh-leaf-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Conservative selection
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          selected=true
          mkdir -p target/ci
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only -z "$BASE_SHA" HEAD > target/ci/changed-paths.nul
            selected=false
            while IFS= read -r -d '' path; do
              if [[ "$path" != *.md ]]; then selected=true; fi
            done < target/ci/changed-paths.nul
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "Full fresh leaf fallback selected: $selected. Markdown-only PRs retain projection and bootstrap checks." | tee target/ci/selection.txt
      - name: Fresh catalog fallback
        if: steps.selection.outputs.selected == 'true'
        run: clojure -Srepro -M tools/ci/run.clj leaves
      - name: Preserve failure receipts
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD HEAD^{tree} > target/ci/checkout.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1
          java -version > target/ci/java.txt 2>&1
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          find target/ci -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-leaves-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  core-readiness:
    name: source-Core-readiness
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report unavailable genuine integration gate
        run: |
          echo '::error::Genuine current-source Core construction and independent fresh verification are unavailable on main. Native owner is repairing the C3 Reader-provenance join (C6-VERIFY/:actual-selected-current-reader-products). No modeled test substitutes for this gate.'
          echo 'Source-to-Core gate: unavailable/nonpassing; no genuine compiler execution claimed.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

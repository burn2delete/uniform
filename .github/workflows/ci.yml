name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  checks:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [static, contracts, bootstrap, macro, checked-core-runtime]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Install workflow syntax checker
        if: matrix.mode == 'static'
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint/archive.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/archive.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Run checks in fresh child processes
        env:
          CI_MODE: ${{ matrix.mode }}
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj "$CI_MODE"
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Preserve logs, command receipts and provenance
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git status --porcelain > target/ci/worktree.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  # Resolution: 3 fresh children, 1800s summed watchdogs, 45min summed job ceilings.
  # Serialization covers this matrix only. Other checks retain their cap of 2;
  # combined pools can reach 3. Initialization repeats; cost equivalence is not claimed.
  resolution:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [resolution-pipeline, resolution-unmetered, resolution-invocation-selection]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Run checks in fresh child processes
        env:
          CI_MODE: ${{ matrix.mode }}
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj "$CI_MODE"
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Preserve logs, command receipts and provenance
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git status --porcelain > target/ci/worktree.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  leaves:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: portable
            check: fresh-leaf-regressions / portable
            runner: ubuntu-24.04
            java: 21.0.8+9.0.LTS
          - platform: darwin
            check: fresh-leaf-regressions / darwin
            runner: macos-26
            java: 26.0.1+8
          - platform: unsupported
            check: darwin-unsupported-host
            runner: macos-15
            java: 26.0.1+8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/clojure
        with:
          java-version: ${{ matrix.java }}
          private-temp: ${{ matrix.platform == 'portable' }}
      - name: Conservative selection
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          selected=true
          mkdir -p target/ci
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only -z "$BASE_SHA" HEAD > target/ci/changed-paths.nul
            selected=false
            while IFS= read -r -d '' path; do
              if [[ "$path" != *.md ]]; then selected=true; fi
            done < target/ci/changed-paths.nul
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "Full fresh leaf fallback selected: $selected. Markdown-only PRs retain contract and bootstrap checks." | tee target/ci/selection.txt
      - name: Diagnose actual Darwin host and descriptor ABI
        if: matrix.platform == 'darwin'
        run: clojure -Srepro -M tools/ci/run.clj darwin-probe
      - name: Fresh catalog fallback
        if: ${{ !cancelled() && steps.selection.outputs.selected == 'true' && matrix.platform != 'unsupported' }}
        env:
          LEAF_PLATFORM: ${{ matrix.platform }}
        run: clojure -Srepro -M tools/ci/run.clj "leaves-$LEAF_PLATFORM"
      - name: Actual unsupported-kernel refusal before publication I/O
        if: ${{ !cancelled() && steps.selection.outputs.selected == 'true' && matrix.platform == 'unsupported' }}
        run: clojure -Srepro -M tools/ci/run.clj darwin-unsupported
      - name: Preserve failure receipts
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git diff HEAD > target/ci/source-mutation.diff
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-leaves-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  core-readiness:
    name: source-Core-readiness
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Report unavailable genuine integration gate
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          echo 'unavailable/nonpassing: C6-VERIFY/:actual-selected-current-reader-products; no genuine execution attempted' > target/ci/core-readiness.txt
          (cd target/ci && shasum -a 256 ./*.txt > SHA256SUMS)
          echo '::error::Genuine current-source Core construction and independent fresh verification are unavailable on main. Native owner is repairing the C3 Reader-provenance join (C6-VERIFY/:actual-selected-current-reader-products). No modeled test substitutes for this gate.'
          echo 'Source-to-Core gate: unavailable/nonpassing; no genuine compiler execution claimed.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-core-readiness-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14

  snapshot:
    name: experimental-source-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Package exact source twice and compare
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/uniform-snapshot-diagnostic"
          command -v clojure > "$RUNNER_TEMP/uniform-snapshot-diagnostic/launcher.txt"
          clojure -J-Xmx256m -Srepro -M tools/ci/snapshot.clj 2> "$RUNNER_TEMP/uniform-snapshot-diagnostic/init.stderr"
      - name: Retain bounded dependency evidence after the single snapshot launch
        if: always()
        run: >-
          java -Xmx128m
          -cp "$CLOJURE_INSTALL_DIR/lib/clojure/libexec/clojure-tools-1.12.5.1654.jar"
          clojure.main tools/ci/snapshot_diagnostics.clj collect "$CLOJURE_INSTALL_DIR"
          "$RUNNER_TEMP/uniform-snapshot-diagnostic"
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Finalize snapshot job provenance even after setup failure
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git diff HEAD > target/ci/source-mutation.diff
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: experimental-source-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/experimental/
            target/ci/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: experimental-prerelease
    needs: [checks, resolution, leaves, snapshot]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: experimental-source-${{ github.sha }}-${{ github.run_attempt }}
          path: snapshot
      - name: Verify and publish experimental source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd snapshot/experimental
          sha256sum --check SHA256SUMS
          test -f "uniform-experimental-source-$GITHUB_SHA.tar.gz"
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/experimental-source-$GITHUB_SHA" --jq length)"
          if [[ "$existing" != 0 ]]; then
            echo 'Refusing to reuse an existing experimental source tag.'
            exit 1
          fi
          gh release create "experimental-source-$GITHUB_SHA" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Experimental source snapshot $GITHUB_SHA" \
            --notes-file CAPABILITIES.md \
            ./*.tar.gz provenance.edn CAPABILITIES.md SHA256SUMS 2>&1 | tee ../publication.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: publication-${{ github.sha }}-${{ github.run_attempt }}
          path: snapshot/
          retention-days: 14

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  select:
    name: select CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      static: ${{ steps.selection.outputs.static }}
      contracts: ${{ steps.selection.outputs.contracts }}
      bootstrap: ${{ steps.selection.outputs.bootstrap }}
      macro: ${{ steps.selection.outputs.macro }}
      resolution: ${{ steps.selection.outputs.resolution }}
      checked-core-runtime: ${{ steps.selection.outputs.checked-core-runtime }}
      leaves-portable: ${{ steps.selection.outputs.leaves-portable }}
      leaves-darwin: ${{ steps.selection.outputs.leaves-darwin }}
      darwin-unsupported: ${{ steps.selection.outputs.darwin-unsupported }}
      static-tools-required: ${{ steps.selection.outputs.static-tools-required }}
      selection-valid: ${{ steps.selection.outputs.selection-valid }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The selector validates the merge commit's two parents and diffs
          # the tested merge against its first parent.  Two commits retain
          # both parent commits and their direct trees without fetching the
          # repository's full history.
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Select existing CI paths
        id: selection
        env:
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj select

  checks:
    name: ${{ matrix.mode }}
    needs: select
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    # Macro runs three sequential fresh children with independent 900-second
    # watchdogs. Leave room for all children, setup, cleanup and upload; the
    # other matrix modes retain their existing 20-minute envelope.
    timeout-minutes: ${{ matrix.mode == 'macro' && 50 || 20 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [static, contracts, bootstrap, macro, checked-core-runtime]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Selected and fail-closed compiler jobs retain full history because
          # their suites materialize pinned historical git-show sources.  An
          # unselected matrix job only records its checked-out tree and can
          # use a single commit.
          fetch-depth: ${{ needs.select.result == 'success' && needs.select.outputs.selection-valid == 'true' && needs.select.outputs[matrix.mode] == 'false' && 1 || 0 }}
          persist-credentials: false
      - uses: ./.github/actions/clojure
        if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs[matrix.mode] != 'false') }}
        with:
          install-static-tools: ${{ matrix.mode == 'static' && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs.static-tools-required != 'false') }}
      - name: Retain unselected CI status
        if: ${{ always() && !cancelled() && needs.select.result == 'success' && needs.select.outputs.selection-valid == 'true' && needs.select.outputs[matrix.mode] == 'false' }}
        env:
          CI_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p target/ci
          printf '{:mode "%s" :status :skipped :reason :unaffected-shared-selection}\n' "$CI_MODE" > "target/ci/$CI_MODE-summary.edn"
          echo "CI mode $CI_MODE skipped by the shared path selection; required matrix job retained"
      - name: Install workflow syntax checker
        if: ${{ always() && !cancelled() && matrix.mode == 'static' && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs.static-tools-required != 'false') }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint/archive.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/archive.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Run selected checks in fresh child processes (docs-only PRs retain contract checks)
        if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs[matrix.mode] != 'false') }}
        env:
          CI_MODE: ${{ matrix.mode }}
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj "$CI_MODE"
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Preserve logs, command receipts and provenance
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git status --porcelain > target/ci/worktree.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -path ./SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  resolution:
    name: ${{ matrix.mode }}
    needs: select
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    # resolution-pipeline owns two sequential fresh children, each with an
    # independent 600-second watchdog; the other modes own one child each.
    # The 25-minute hosted envelope leaves setup, cleanup and artifact-upload
    # time beyond the pipeline's 1,200-second maximum child budget. The three
    # jobs are serialized only within this resolution pool; no global
    # parallelism or cost equivalence is implied.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [resolution-pipeline, resolution-unmetered, resolution-invocation-selection]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Resolution selection retains the logical stage output while each
          # matrix child records its own mode and fresh checkout.
          fetch-depth: ${{ needs.select.result == 'success' && needs.select.outputs.selection-valid == 'true' && needs.select.outputs.resolution == 'false' && 1 || 0 }}
          persist-credentials: false
      - uses: ./.github/actions/clojure
        if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs.resolution != 'false') }}
      - name: Retain unselected resolution status
        if: ${{ always() && !cancelled() && needs.select.result == 'success' && needs.select.outputs.selection-valid == 'true' && needs.select.outputs.resolution == 'false' }}
        env:
          CI_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p target/ci
          printf '{:mode "%s" :status :skipped :reason :unaffected-shared-selection}\n' "$CI_MODE" > "target/ci/$CI_MODE-summary.edn"
          echo "CI mode $CI_MODE skipped by the shared resolution selection; required matrix job retained"
      - name: Run selected resolution check in a fresh child process
        if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs.resolution != 'false') }}
        env:
          CI_MODE: ${{ matrix.mode }}
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj "$CI_MODE"
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Preserve resolution logs, receipts and provenance
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git status --porcelain > target/ci/worktree.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -path ./SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  leaves:
    name: ${{ matrix.check }}
    needs: select
    if: ${{ always() && !cancelled() }}
    # The Darwin publication leaf may use Ubuntu only after the selector
    # completed successfully and explicitly verified that it is unaffected.
    # Any selected, full, missing, malformed, or failed selection keeps the
    # platform-specific runner required by the matrix.
    runs-on: ${{ matrix.platform == 'darwin' && needs.select.result == 'success' && needs.select.outputs.selection-valid == 'true' && needs.select.outputs[matrix.selection-key] == 'false' && 'ubuntu-24.04' || matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: portable
            check: fresh-leaf-regressions / portable
            runner: ubuntu-24.04
            java: 21.0.8+9.0.LTS
            selection-key: leaves-portable
          - platform: darwin
            check: fresh-leaf-regressions / darwin
            runner: macos-26
            java: 26.0.1+8
            selection-key: leaves-darwin
          - platform: unsupported
            check: darwin-unsupported-host
            runner: macos-15
            java: 26.0.1+8
            selection-key: darwin-unsupported
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Selected and fail-closed leaf suites retain full history because
          # their tests materialize pinned historical git-show sources.  An
          # unselected leaf job only records its checked-out tree and can use
          # a single commit.
          fetch-depth: ${{ needs.select.result == 'success' && needs.select.outputs.selection-valid == 'true' && needs.select.outputs[matrix.selection-key] == 'false' && 1 || 0 }}
          persist-credentials: false
      - uses: ./.github/actions/clojure
        if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs[matrix.selection-key] != 'false') }}
        with:
          java-version: ${{ matrix.java }}
          private-temp: ${{ matrix.platform == 'portable' }}
      - name: Retain unselected leaf status
        if: ${{ always() && !cancelled() && needs.select.result == 'success' && needs.select.outputs.selection-valid == 'true' && needs.select.outputs[matrix.selection-key] == 'false' }}
        env:
          CHECK_NAME: ${{ matrix.check }}
        run: |
          mkdir -p target/ci
          printf '{:status :skipped :reason :unaffected-shared-selection}\n' > target/ci/leaf-summary.edn
          echo "CI check $CHECK_NAME skipped by the shared path selection; required matrix job retained"
      - name: Diagnose actual Darwin host and descriptor ABI
        if: ${{ always() && !cancelled() && matrix.platform == 'darwin' && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs[matrix.selection-key] != 'false') }}
        run: clojure -Srepro -M tools/ci/run.clj darwin-probe
      - name: Fresh path-aware catalog selection
        if: ${{ always() && !cancelled() && matrix.platform != 'unsupported' && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs[matrix.selection-key] != 'false') }}
        env:
          LEAF_PLATFORM: ${{ matrix.platform }}
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj "leaves-$LEAF_PLATFORM"
      - name: Actual unsupported-kernel refusal before publication I/O
        if: ${{ always() && !cancelled() && matrix.platform == 'unsupported' && (needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs[matrix.selection-key] != 'false') }}
        run: clojure -Srepro -M tools/ci/run.clj darwin-unsupported
      - name: Preserve failure receipts
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git diff HEAD > target/ci/source-mutation.diff
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -path ./SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-leaves-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  snapshot:
    name: experimental-source-snapshot
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The archive is rooted at HEAD and its notes retain git log -10.
          fetch-depth: 10
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Verify deterministic archive recipe
        run: clojure -J-Xmx256m -Srepro -M tools/ci/snapshot_test.clj
      - name: Package exact source archive and checksum
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/uniform-snapshot-diagnostic"
          command -v clojure > "$RUNNER_TEMP/uniform-snapshot-diagnostic/launcher.txt"
          clojure -J-Xmx256m -Srepro -M tools/ci/snapshot.clj 2> "$RUNNER_TEMP/uniform-snapshot-diagnostic/init.stderr"
      - name: Retain bounded dependency evidence after the single snapshot launch
        if: always()
        run: >-
          java -Xmx128m
          -cp "$CLOJURE_INSTALL_DIR/lib/clojure/libexec/clojure-tools-1.12.5.1654.jar"
          clojure.main tools/ci/snapshot_diagnostics.clj collect "$CLOJURE_INSTALL_DIR"
          "$RUNNER_TEMP/uniform-snapshot-diagnostic"
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Finalize snapshot job provenance even after setup failure
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git diff HEAD > target/ci/source-mutation.diff
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -path ./SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: experimental-source-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/experimental/
            target/ci/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: experimental-prerelease
    needs: [checks, resolution, leaves, snapshot]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: experimental-source-${{ github.sha }}-${{ github.run_attempt }}
          path: snapshot
      - name: Verify and publish experimental source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          cd snapshot/experimental
          sha256sum --check SHA256SUMS
          test -f "uniform-experimental-source-$GITHUB_SHA.tar.gz"
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/experimental-source-$GITHUB_SHA" --jq length)"
          if [[ "$existing" != 0 ]]; then
            echo 'Refusing to reuse an existing experimental source tag.'
            exit 1
          fi
          gh release create "experimental-source-$GITHUB_SHA" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Experimental source snapshot $GITHUB_SHA" \
            --notes-file CAPABILITIES.md \
            ./*.tar.gz provenance.edn CAPABILITIES.md SHA256SUMS 2>&1 | tee ../publication.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: publication-${{ github.sha }}-${{ github.run_attempt }}
          path: snapshot/
          retention-days: 14

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  select:
    name: select CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      static: ${{ steps.selection.outputs.static }}
      contracts: ${{ steps.selection.outputs.contracts }}
      bootstrap: ${{ steps.selection.outputs.bootstrap }}
      macro: ${{ steps.selection.outputs.macro }}
      resolution: ${{ steps.selection.outputs.resolution }}
      checked-core-runtime: ${{ steps.selection.outputs.checked-core-runtime }}
      leaves-portable: ${{ steps.selection.outputs.leaves-portable }}
      leaves-darwin: ${{ steps.selection.outputs.leaves-darwin }}
      darwin-unsupported: ${{ steps.selection.outputs.darwin-unsupported }}
      static-tools-required: ${{ steps.selection.outputs.static-tools-required }}
      checked-js-owner-required: ${{ steps.selection.outputs.checked-js-owner-required }}
      # Only a complete set of booleans can narrow the PR matrix.
      selection-valid: >-
        ${{ steps.selection.outputs.selection-valid == 'true' &&
            steps.selection.outputs.static == 'true' && steps.selection.outputs.contracts == 'true' &&
            (steps.selection.outputs.bootstrap == 'true' || steps.selection.outputs.bootstrap == 'false') &&
            (steps.selection.outputs.macro == 'true' || steps.selection.outputs.macro == 'false') &&
            (steps.selection.outputs.resolution == 'true' || steps.selection.outputs.resolution == 'false') &&
            (steps.selection.outputs.checked-core-runtime == 'true' || steps.selection.outputs.checked-core-runtime == 'false') &&
            (steps.selection.outputs.leaves-portable == 'true' || steps.selection.outputs.leaves-portable == 'false') &&
            (steps.selection.outputs.leaves-darwin == 'true' || steps.selection.outputs.leaves-darwin == 'false') &&
            (steps.selection.outputs.darwin-unsupported == 'true' || steps.selection.outputs.darwin-unsupported == 'false') &&
            (steps.selection.outputs.static-tools-required == 'true' || steps.selection.outputs.static-tools-required == 'false') &&
            (steps.selection.outputs.checked-js-owner-required == 'true' || steps.selection.outputs.checked-js-owner-required == 'false') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The selector validates the merge commit's two parents and diffs
          # the tested merge against its first parent.  Two commits retain
          # both parent commits and their direct trees without fetching the
          # repository's full history.
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Select existing CI paths
        id: selection
        env:
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj select

  checks:
    name: ${{ matrix.mode }}
    needs: select
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    # Leave time after the sequential child watchdogs for setup, cleanup and upload.
    timeout-minutes: ${{ matrix.mode == 'checked-core-runtime' && 85 || matrix.mode == 'macro' && 50 || 20 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [static, contracts, bootstrap, macro, checked-core-runtime]
        selected-pr: &selected-pr
          - ${{ github.event_name == 'pull_request' && needs.select.result == 'success' && needs.select.outputs.selection-valid == 'true' }}
        exclude:
          - selected-pr: true
            mode: ${{ needs.select.outputs.bootstrap == 'false' && 'bootstrap' || '' }}
          - selected-pr: true
            mode: ${{ needs.select.outputs.macro == 'false' && 'macro' || '' }}
          - selected-pr: true
            mode: ${{ needs.select.outputs.checked-core-runtime == 'false' && 'checked-core-runtime' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Compiler suites materialize pinned historical git-show sources.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js 20 for checked JavaScript tests
        if: ${{ !cancelled() && matrix.mode == 'checked-core-runtime' && (!matrix.selected-pr || needs.select.outputs.checked-js-owner-required != 'false') }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.2
      - uses: ./.github/actions/clojure
        if: ${{ !cancelled() }}
        with:
          install-static-tools: ${{ matrix.mode == 'static' && (!matrix.selected-pr || needs.select.outputs.static-tools-required != 'false') }}
      - name: Install workflow syntax checker
        id: setup-workflow-checker
        if: ${{ !cancelled() && matrix.mode == 'static' && (!matrix.selected-pr || needs.select.outputs.static-tools-required != 'false') }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint/archive.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/archive.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Run selected checks in fresh child processes (docs-only PRs retain contract checks)
        id: run-checks
        if: ${{ !cancelled() }}
        env:
          CI_MODE: ${{ matrix.mode }}
          CI_FORCE_FULL: ${{ !matrix.selected-pr || needs.select.outputs[matrix.mode] != 'true' }}
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj "$CI_MODE"
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Preserve logs, command receipts and provenance
        id: retain-provenance
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git status --porcelain > target/ci/worktree.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  resolution:
    name: ${{ matrix.mode }}
    needs: select
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs.resolution != 'false') }}
    runs-on: ubuntu-24.04
    # The three independent Resolution modes can overlap. resolution-pipeline
    # still owns two sequential fresh children, each with an independent
    # 600-second watchdog; the other modes own one child each. The 25-minute
    # hosted envelope leaves setup, cleanup and artifact-upload time beyond
    # the pipeline's 1,200-second maximum child budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [resolution-pipeline, resolution-unmetered, resolution-invocation-selection]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/clojure
        if: ${{ !cancelled() }}
      - name: Run selected resolution check in a fresh child process
        id: run-checks
        if: ${{ !cancelled() }}
        env:
          CI_MODE: ${{ matrix.mode }}
          CI_FORCE_FULL: ${{ github.event_name != 'pull_request' || needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs.resolution != 'true' }}
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj "$CI_MODE"
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Preserve resolution logs, receipts and provenance
        id: retain-provenance
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git status --porcelain > target/ci/worktree.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  leaves:
    name: ${{ matrix.mode == 'leaves-portable' && 'fresh-leaf-regressions / portable' || matrix.mode == 'leaves-darwin' && 'fresh-leaf-regressions / darwin' || 'darwin-unsupported-host' }}
    needs: select
    # GitHub evaluates this condition before expanding the matrix.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.select.result != 'success' || needs.select.outputs.selection-valid != 'true' || needs.select.outputs.leaves-portable != 'false' || needs.select.outputs.leaves-darwin != 'false' || needs.select.outputs.darwin-unsupported != 'false') }}
    runs-on: ${{ matrix.mode == 'leaves-portable' && 'ubuntu-24.04' || matrix.mode == 'leaves-darwin' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [leaves-portable, leaves-darwin, darwin-unsupported]
        selected-pr: *selected-pr
        exclude:
          - selected-pr: true
            mode: ${{ needs.select.outputs.leaves-portable == 'false' && 'leaves-portable' || '' }}
          - selected-pr: true
            mode: ${{ needs.select.outputs.leaves-darwin == 'false' && 'leaves-darwin' || '' }}
          - selected-pr: true
            mode: ${{ needs.select.outputs.darwin-unsupported == 'false' && 'darwin-unsupported' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/clojure
        if: ${{ !cancelled() }}
        with:
          java-version: ${{ matrix.mode == 'leaves-portable' && '21.0.8+9.0.LTS' || '26.0.1+8' }}
          private-temp: ${{ matrix.mode == 'leaves-portable' }}
      - name: Diagnose actual Darwin host and descriptor ABI
        id: darwin-probe
        if: ${{ !cancelled() && matrix.mode == 'leaves-darwin' }}
        run: clojure -Srepro -M tools/ci/run.clj darwin-probe
      - name: Fresh path-aware catalog selection
        id: run-checks
        if: ${{ !cancelled() && matrix.mode != 'darwin-unsupported' }}
        env:
          CI_MODE: ${{ matrix.mode }}
          CI_FORCE_FULL: ${{ !matrix.selected-pr || needs.select.outputs[matrix.mode] != 'true' }}
          CI_BASE_SHA: ${{ github.event.before }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: clojure -Srepro -M tools/ci/run.clj "$CI_MODE"
      - name: Actual unsupported-kernel refusal before publication I/O
        id: run-unsupported-check
        if: ${{ !cancelled() && matrix.mode == 'darwin-unsupported' }}
        run: clojure -Srepro -M tools/ci/run.clj darwin-unsupported
      - name: Preserve failure receipts
        id: retain-provenance
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git diff HEAD > target/ci/source-mutation.diff
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-${{ matrix.mode == 'darwin-unsupported' && 'leaves-unsupported' || matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci/
          retention-days: 14
          if-no-files-found: error

  snapshot:
    name: experimental-source-snapshot
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The archive is rooted at HEAD and its notes retain git log -10.
          fetch-depth: 10
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Verify deterministic archive recipe
        run: clojure -J-Xmx256m -Srepro -M tools/ci/snapshot_test.clj
      - name: Package exact source archive and checksum
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/uniform-snapshot-diagnostic"
          command -v clojure > "$RUNNER_TEMP/uniform-snapshot-diagnostic/launcher.txt"
          clojure -J-Xmx256m -Srepro -M tools/ci/snapshot.clj 2> "$RUNNER_TEMP/uniform-snapshot-diagnostic/init.stderr"
      - name: Retain bounded dependency evidence after the single snapshot launch
        if: always()
        run: >-
          java -Xmx128m
          -cp "$CLOJURE_INSTALL_DIR/lib/clojure/libexec/clojure-tools-1.12.5.1654.jar"
          clojure.main tools/ci/snapshot_diagnostics.clj collect "$CLOJURE_INSTALL_DIR"
          "$RUNNER_TEMP/uniform-snapshot-diagnostic"
      - name: Reject tracked source mutation
        if: always()
        run: git diff --exit-code HEAD
      - name: Finalize snapshot job provenance even after setup failure
        if: always()
        run: |
          mkdir -p target/ci
          git rev-parse HEAD 'HEAD^{tree}' > target/ci/checkout.txt
          git diff HEAD > target/ci/source-mutation.diff
          java -version > target/ci/java.txt 2>&1 || echo 'Java probe failed' >> target/ci/java.txt
          clojure -Sdescribe > target/ci/clojure.txt 2>&1 || echo 'Clojure probe failed' >> target/ci/clojure.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/ci/run-url.txt
          ci_sum="$(mktemp "$RUNNER_TEMP/ci-checksums.XXXXXX")"
          (cd target/ci && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + | sort) > "$ci_sum"
          mv "$ci_sum" target/ci/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: experimental-source-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/experimental/
            target/ci/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: experimental-prerelease
    needs: [checks, resolution, leaves, snapshot]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: experimental-source-${{ github.sha }}-${{ github.run_attempt }}
          path: snapshot
      - name: Verify and publish experimental source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          cd snapshot/experimental
          sha256sum --check SHA256SUMS
          test -f "uniform-experimental-source-$GITHUB_SHA.tar.gz"
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/experimental-source-$GITHUB_SHA" --jq length)"
          if [[ "$existing" != 0 ]]; then
            echo 'Refusing to reuse an existing experimental source tag.'
            exit 1
          fi
          gh release create "experimental-source-$GITHUB_SHA" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Experimental source snapshot $GITHUB_SHA" \
            --notes-file CAPABILITIES.md \
            ./*.tar.gz provenance.edn CAPABILITIES.md SHA256SUMS 2>&1 | tee ../publication.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: publication-${{ github.sha }}-${{ github.run_attempt }}
          path: snapshot/
          retention-days: 14

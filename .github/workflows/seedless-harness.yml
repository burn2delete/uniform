name: Seedless harness

on:
  pull_request:
    paths:
      - tools/seedless/**
      - tools/gravity/compiler_probe.clj
      - tools/simplify/**
      - .github/workflows/seedless-harness.yml
      - .github/actions/clojure/**
  push:
    branches: [main]
    paths:
      - tools/seedless/**
      - tools/gravity/compiler_probe.clj
      - tools/simplify/**
      - .github/workflows/seedless-harness.yml
      - .github/actions/clojure/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seedless-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Seedless deterministic workflow tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/clojure
      - name: Test without inference or GitHub writes
        working-directory: tools/seedless
        run: clojure -Srepro -M:test

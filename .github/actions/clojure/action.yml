name: Pinned Clojure toolchain
description: Clojure bootstrap tooling on GitHub hosted Linux and macOS
inputs:
  java-version:
    description: Exact JDK required by the selected source contract
    default: 21.0.8+9.0.LTS
  private-temp:
    description: Use an owned Java temporary directory for portable cache tests
    default: 'true'
  install-static-tools:
    description: Install the pinned clj-kondo and cljfmt tools used by static CI
    default: 'false'
runs:
  using: composite
  steps:
    - name: Prepare an owned private Java temporary directory
      if: inputs.private-temp == 'true'
      shell: bash
      run: |
        ci_tmp="$RUNNER_TEMP/uniform-ci"
        umask 077
        mkdir -p "$ci_tmp"
        chmod 700 "$ci_tmp"
        printf 'JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=%s\n' "$ci_tmp" >> "$GITHUB_ENV"
        printf 'TMPDIR=%s/\n' "$ci_tmp" >> "$GITHUB_ENV"
    - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
    - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
      with:
        cli: 1.12.5.1654
        clj-kondo: ${{ inputs.install-static-tools == 'true' && '2025.10.23' || '' }}
        cljfmt: ${{ inputs.install-static-tools == 'true' && '0.13.4' || '' }}
